<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Resume Form Test</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .section {
            margin-bottom: 20px;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .col {
            flex: 1;
        }
    </style>
</head>

<body>
    <h1>Resume Form Test Page</h1>
    <form id="resumeForm">
        <div class="section">
            <h2>Personal Details</h2>
            <div class="row">
                <div class="col">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name">
                </div>
                <div class="col">
                    <label>Middle Name</label>
                    <input type="text" name="middle_name">
                </div>
                <div class="col">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label>Date Of Birth</label>
                    <input type="text" name="dob" placeholder="DD/MM/YYYY">
                </div>
                <div class="col">
                    <label>Gender</label>
                    <select name="gender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Communication Details</h2>
            <label>Address</label>
            <textarea name="address"></textarea>
            <div class="row">
                <div class="col">
                    <label>City</label>
                    <input type="text" name="city">
                </div>
                <div class="col">
                    <label>Email</label>
                    <input type="email" name="email">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Employment Details</h2>
            <label>Last Employer</label>
            <input type="text" name="last_employer" placeholder="Company Name">
            <label>Career Objective</label>
            <textarea name="objective"></textarea>
        </div>

        <button type="button" onclick="alert('Form Submitted (Mock)')">Submit Form</button>
    </form>
</body>

</html>
